[project]
name = "venue-insight-pipeline"
version = "0.1.0"
description = "Discover, deduplicate and extract insider insights for NYC venues from open sources"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "tenacity>=9.0",
    "rapidfuzz>=3.9",
    "shapely>=2.1.2",
]

[project.scripts]
pipeline = "pipeline.cli:app"

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "UP", "I"]
ignore = ["B008"]  # typer.Option in defaults is the documented idiom
