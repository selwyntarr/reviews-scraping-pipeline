# Database is the Supabase local stack (`supabase start`), reached via host.docker.internal.
# Ollama runs on the Mac host for Apple Silicon acceleration.
x-env: &container-env
  DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
  OLLAMA_BASE_URL: http://host.docker.internal:11434

services:
  pipeline:
    build: .
    env_file: .env
    environment: *container-env
    volumes:
      - ./reviews:/app/reviews
    extra_hosts:
      - "host.docker.internal:host-gateway"

  scheduler:
    build: .
    env_file: .env
    environment: *container-env
    volumes:
      - ./reviews:/app/reviews
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "-c"]
    # Nightly freshness run at 03:00 container time (simple loop, no cron daemon needed).
    command:
      - |
        while true; do
          if [ "$$(date +%H:%M)" = "03:00" ]; then /app/.venv/bin/pipeline freshness; sleep 60; fi
          sleep 20
        done
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app            # source bind-mounted: edits on the host hot-reload in the container
      - web_node_modules:/app/node_modules   # container-built deps, not the host's
      - web_next:/app/.next
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  web_node_modules:
  web_next:
